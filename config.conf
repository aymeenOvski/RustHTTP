# ==========================================
# SERVER 1: Main Web & Static Server
# ==========================================
[server.main]
host = 127.0.0.1
ports = 8080, 8090
is_default = true
client_max_body_size = 1048576  # 1MB limit for uploads (triggers 413 if exceeded)

# Custom error pages mapped to static files
error_400 = www/errors/400.html
error_403 = www/errors/403.html
error_404 = www/errors/404.html
error_405 = www/errors/405.html
error_413 = www/errors/413.html
error_500 = www/errors/500.html

# Home route (Root directory)
[route.main./]
root = www
methods = GET
index = index.html
autoindex = false

# Uploads and file management route (Supports DELETE and uploads)
[route.main./files]
root = www/uploads
upload_dir = www/uploads
methods = GET, POST, DELETE
autoindex = true 

# Redirection route
[route.main./old-page]
redirect = /

# CGI script execution route (.py extension)
[route.main./cgi]
root = cgi-bin
methods = GET, POST
cgi_extension = .py


# ==========================================
# SERVER 2: Secondary API / Testing Server
# ==========================================
[server.api]
host = 127.0.0.1
ports = 9090
is_default = false
client_max_body_size = 5242880  # 5MB limit

# Custom error pages mapped to static files
error_400 = www/errors/400.html
error_403 = www/errors/403.html
error_404 = www/errors/404.html
error_405 = www/errors/405.html
error_413 = www/errors/413.html
error_500 = www/errors/500.html

# Home route (Root directory)
[route.api./]
root = www
methods = GET
index = index.html
autoindex = false

# Uploads and file management route (Supports DELETE and uploads)
[route.api./files]
root = www/uploads
upload_dir = www/uploads
methods = GET, POST, DELETE
autoindex = true 

# Redirection route
[route.api./old-page]
redirect = /

# CGI script execution route (.py extension)
[route.api./cgi]
