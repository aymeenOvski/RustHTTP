# LocalServer TEST config (Person B's format). Your real config.conf is separate.
# Start the server from the project root with:  cargo run -- test/test.conf
# Every path below is relative to the project root. The test site lives in
# test/www/ (created by config_tests.sh), so your real www/ is untouched.

# ── Server 1: two ports, default server, custom error pages, 1 MB limit ──
[server.main]
host = 127.0.0.1
ports = 8080, 8081
server_names = localhost
is_default = true
client_max_body_size = 1000000
error_404 = test/www/errors/404.html
error_403 = test/www/errors/403.html

# Default file for the site root.
[route.main./]
root = test/www
methods = GET
index = index.html
autoindex = false

# Directory listing ON, and DELETE allowed.
[route.main./docs]
root = test/www/docs
methods = GET, DELETE
autoindex = true

# No index file and listing OFF -> 403. DELETE allowed.
[route.main./trash]
root = test/www/trash
methods = GET, DELETE
autoindex = false

# A default file that is NOT index.html.
[route.main./site]
root = test/www/site
methods = GET
index = home.html

# File uploads.
[route.main./upload]
root = test/www/uploads
methods = GET, POST
upload_dir = test/www/uploads

# Redirection.
[route.main./old]
methods = GET
redirect = /

# CGI by file extension.
[route.main./cgi-bin]
root = test/www/cgi-bin
methods = GET, POST
cgi_extension = .py

# ── Server 2: another port, tiny body limit (100 bytes) ──────────────────
[server.small]
host = 127.0.0.1
ports = 8082
server_names = small.local
client_max_body_size = 100

[route.small./]
root = test/www/small
methods = GET
index = index.html